# /etc/nginx/sites-available/urban210.ru
server {
    listen 80;
    listen [::]:80;
    server_name urban210.ru www.urban210.ru;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://urban210.ru$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.urban210.ru;
    ssl_certificate /etc/letsencrypt/live/urban210.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/urban210.ru/privkey.pem;
    return 301 https://urban210.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name urban210.ru;
    ssl_certificate /etc/letsencrypt/live/urban210.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/urban210.ru/privkey.pem;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Статика Next.js отдаётся напрямую из релиза
    location /_next/static/ {
        alias /opt/urban210/current/.next/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Старые адреса WordPress, которых нет на новом сайте
    location ~ ^/(wp-content|wp-includes|wp-json|xmlrpc\.php) { return 301 /; }

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
