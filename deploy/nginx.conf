# /etc/nginx/sites-available/urban210.ru
# Статика Astro отдаётся из /opt/urban210/current/client, заявки /api/ проксируются в Node (порт 3210).
server {
    listen 80;
    listen [::]:80;
    server_name urban210.ru www.urban210.ru;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://urban210.ru$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.urban210.ru;
    ssl_certificate /etc/letsencrypt/live/urban210.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/urban210.ru/privkey.pem;
    return 301 https://urban210.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name urban210.ru;
    ssl_certificate /etc/letsencrypt/live/urban210.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/urban210.ru/privkey.pem;

    root /opt/urban210/current/client;
    index index.html;
    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Старые адреса WordPress и прототипа
    location = /site/policy { return 301 /policy/; }
    location = /tariffs { return 301 /price/; }
    location = /tour { return 301 /virtual-tour/; }
    location = /contact { return 301 /contacts/; }
    location = /services { return 301 /; }
    location = /schedule { return 301 /group/; }
    location = /feed { return 301 /; }
    location ^~ /wp-admin { return 302 /; }
    location ~ ^/(wp-content|wp-includes|wp-json|xmlrpc\.php) { return 301 /; }
    location ~ ^/promo/11-вдвоём-выгоднее/?$ { return 301 /promo/1-plus-1/; }
    location ~ ^/promo/тестовыи-день-за-1-рубль/?$ { return 301 /promo/1-rubl/; }
    location ~ ^/promo/trade-in-urban/?$ { return 301 /promo/trade-in/; }

    # Заявки
    location /api/ {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Файлы сборки с хешем в имени и шрифты: надолго
    location ^~ /_astro/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location ~* \.(?:woff2|avif|webp|jpe?g|png|svg|ico|mp4)$ { expires 30d; add_header Cache-Control "public"; try_files $uri =404; }
    location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ =404; }
}
