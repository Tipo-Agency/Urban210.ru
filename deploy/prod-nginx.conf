# urban210.ru на tipa-prod: статика из /var/www/urban210/current/client, заявки /api/ через node (urban210.service, порт 3210).
# HTTPS добавляет certbot --nginx (строки «managed by Certbot» допишутся сами).
map $request_uri $u210_old {
    default "";
    ~^/promo/11-                       /promo/1-plus-1/;
    ~^/promo/%D0%BF%D0%B5%D1%80%D1%81  /promo/;
    ~^/promo/trade-in-urban            /promo/trade-in/;
    ~^/promo/%D1%82%D0%B5%D1%81%D1%82  /price/;
    ~^/promo/1-rubl                    /price/;
    ~^/site/policy                     /policy/;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.urban210.ru;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://urban210.ru$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name urban210.ru;
    root /var/www/urban210/current/client;
    index index.html;
    charset utf-8;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Старые адреса WordPress
    if ($u210_old) { return 301 $u210_old; }
    location ~ ^/(wp-admin|wp-login\.php|wp-content|wp-includes|wp-json|xmlrpc\.php|feed|comments/feed) { return 410; }
    if ($arg_p) { return 301 /; }
    if ($arg_page_id) { return 301 /; }

    location /api/ {
        proxy_pass http://127.0.0.1:3210;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32k;
    }

    location ^~ /_astro/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location ^~ /fonts/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
}
