# /etc/nginx/sites-available/urban210.uchetgram.ru
# Превью дизайна Urban210 для выбора стиля клиентом. Не индексируется, заявки не отправляются, Метрики нет.
# Статика: /var/www/urban210-preview (dist/client из ветки claude/astro-rebuild). Сертификат: certbot --nginx -d urban210.uchetgram.ru
server {
    listen 80;
    listen [::]:80;
    server_name urban210.uchetgram.ru;

    root /var/www/urban210-preview;
    index index.html;
    error_page 404 /404.html;

    add_header X-Robots-Tag "noindex, nofollow" always;

    # Главная превью ведёт на список концепций (шорт-лист сверху)
    location = / { return 302 /concepts/; }

    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }

    # Заявки с превью никуда не уходят: форма показывает это сообщение
    location /api/ {
        default_type application/json;
        return 200 '{"ok":false,"error":"Это превью дизайна, заявки отсюда не отправляются. Позвоните: +7 (4212) 95-09-20"}';
    }

    location ^~ /_astro/ { expires 7d; add_header Cache-Control "public"; add_header X-Robots-Tag "noindex, nofollow" always; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
